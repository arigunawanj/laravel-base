name: Build base image

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  # Bangun ulang tiap bulan supaya patch keamanan PHP dan Alpine ikut masuk.
  schedule:
    - cron: '0 20 1 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tanggal untuk tag
        id: date
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ghcr.io/${{ github.repository }}:8.4
            ghcr.io/${{ github.repository }}:8.4-${{ steps.date.outputs.d }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
